name: Release (macOS)

# Build, sign, notarize, and publish Snip Talk for macOS.
#
# Triggers:
#   • push of a tag like v0.1.0          → full release, uploads to a GitHub Release
#   • manual run via "Run workflow"      → builds artifacts, optional release upload
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_IDENTITY                   e.g. "Developer ID Application: Acme (TEAMID)"
#   APPLE_ID                         Apple ID email used for notarization
#   APPLE_TEAM_ID                    10-char Apple Developer team id
#   APPLE_APP_SPECIFIC_PASSWORD      app-specific password for notarytool
#   APPLE_CERT_P12_BASE64            base64 of your Developer ID .p12 file
#   APPLE_CERT_PASSWORD              password used when exporting the .p12
#
# Without the cert/notary secrets the workflow still produces an UNSIGNED build
# (useful for smoke-testing PRs).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      arch:
        description: "Target arch"
        type: choice
        default: "universal"
        options: ["arm64", "x64", "universal"]
      publish_release:
        description: "Upload artifacts to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write    # needed to create/update a Release

# Opt into Node 24 for JS-based actions so the deprecation warnings stop
# appearing and we're future-proof past June 2026.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      build_universal: ${{ steps.set.outputs.build_universal }}
    steps:
      - id: set
        env:
          EVENT: ${{ github.event_name }}
          ARCH_INPUT: ${{ inputs.arch }}
        run: |
          set -euo pipefail
          # Native runners per arch — no cross-compilation.
          # Universal is produced by a separate merge job, not the matrix.
          if [[ "$EVENT" == "workflow_dispatch" && -n "${ARCH_INPUT:-}" ]]; then
            case "$ARCH_INPUT" in
              arm64)     MATRIX='{"include":[{"arch":"arm64","runner":"macos-14"}]}'; UNI=false ;;
              x64)       MATRIX='{"include":[{"arch":"x64","runner":"macos-13"}]}';   UNI=false ;;
              universal) MATRIX='{"include":[{"arch":"arm64","runner":"macos-14"},{"arch":"x64","runner":"macos-13"}]}'; UNI=true ;;
              *) echo "Unknown arch input: $ARCH_INPUT" >&2; exit 1 ;;
            esac
          else
            MATRIX='{"include":[{"arch":"arm64","runner":"macos-14"},{"arch":"x64","runner":"macos-13"}]}'
            UNI=true
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "build_universal=$UNI" >> "$GITHUB_OUTPUT"
          echo "Resolved matrix: $MATRIX (universal=$UNI)"

  build:
    name: Build • ${{ matrix.arch }}
    needs: setup
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          case "$(uname -m)" in
            arm64|aarch64) ROLLUP_PKG="@rollup/rollup-darwin-arm64" ;;
            x86_64)        ROLLUP_PKG="@rollup/rollup-darwin-x64" ;;
            *) echo "Unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          echo "Installing $ROLLUP_PKG for $(uname -m)"
          npm install --no-save "$ROLLUP_PKG"

      - name: Run unit tests
        run: npm test --silent --if-present

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, package
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/release-mac.sh

      - name: Compute artifact paths
        id: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          SUFFIX="darwin-${{ matrix.arch }}"
          ZIP=$(ls release/*-${SUFFIX}.zip | head -n1)
          DMG=$(ls release/*-${SUFFIX}.dmg | head -n1)
          JSON=$(ls release/*-${SUFFIX}.json | head -n1)
          BASE="$(basename "${JSON%.json}")"
          echo "zip=$ZIP"   >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG"   >> "$GITHUB_OUTPUT"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Stamped artifact base: $BASE"

      - name: Verify artifacts (size, checksum, arch, codesign)
        env:
          ZIP: ${{ steps.artifacts.outputs.zip }}
          DMG: ${{ steps.artifacts.outputs.dmg }}
          JSON: ${{ steps.artifacts.outputs.json }}
          BASE: ${{ steps.artifacts.outputs.base }}
          MIN_BYTES: 20000000
          MAX_BYTES: 600000000
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          ok()   { echo "✅ $*"; }

          [[ -f "$ZIP"  ]] || fail "ZIP missing: $ZIP"
          [[ -f "$DMG"  ]] || fail "DMG missing: $DMG"
          [[ -f "$JSON" ]] || fail "manifest missing: $JSON"

          for f in "$ZIP" "$DMG"; do
            sz=$(stat -f%z "$f")
            (( sz >= MIN_BYTES )) || fail "$f too small (${sz}B)"
            (( sz <= MAX_BYTES )) || fail "$f too large (${sz}B)"
            ok "size OK: $(basename "$f")"
          done

          ( cd release && shasum -a 256 -c "${BASE}.SHASUMS" ) || fail "checksum failed"
          ok "sha256 verified"

          # Confirm the packaged binary's arch matches matrix.arch.
          MOUNT="$RUNNER_TEMP/dmg-mount-${{ matrix.arch }}"
          rm -rf "$MOUNT" && mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -quiet
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT
          APP=$(ls -d "$MOUNT"/*.app | head -n1)
          MAIN_BIN=$(ls "$APP"/Contents/MacOS/* | head -n1)
          ARCHS=$(lipo -archs "$MAIN_BIN" 2>/dev/null || file "$MAIN_BIN")
          echo "binary archs: $ARCHS"
          case "${{ matrix.arch }}" in
            arm64) [[ "$ARCHS" == *arm64*  && "$ARCHS" != *x86_64* ]] || fail "expected arm64-only, got: $ARCHS" ;;
            x64)   [[ "$ARCHS" == *x86_64* && "$ARCHS" != *arm64*  ]] || fail "expected x86_64-only, got: $ARCHS" ;;
          esac
          ok "binary arch matches matrix.arch=${{ matrix.arch }}"

          if [[ -n "${APPLE_IDENTITY:-}" ]]; then
            codesign --verify --deep --strict --verbose=2 "$APP" || fail "codesign failed"
            ok "codesign verified"
          fi

      - name: Stage .app bundle for universal merge
        run: |
          set -euo pipefail
          APP="release/Snip Talk-darwin-${{ matrix.arch }}/Snip Talk.app"
          [[ -d "$APP" ]] || { echo "::error::no .app at $APP"; exit 1; }
          STAGE="$RUNNER_TEMP/app-stage"
          mkdir -p "$STAGE"
          ( cd "$(dirname "$APP")" && /usr/bin/ditto -c -k --sequesterRsrc --keepParent "Snip Talk.app" "$STAGE/app-darwin-${{ matrix.arch }}.zip" )
          ls -lh "$STAGE"

      - name: Upload .app for universal merge
        uses: actions/upload-artifact@v4
        with:
          name: app-darwin-${{ matrix.arch }}
          path: ${{ runner.temp }}/app-stage/app-darwin-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 3

      - name: Upload workflow artifacts (stamped filenames)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.base }}
          path: |
            release/${{ steps.artifacts.outputs.base }}.zip
            release/${{ steps.artifacts.outputs.base }}.dmg
            release/${{ steps.artifacts.outputs.base }}.json
            release/${{ steps.artifacts.outputs.base }}.json.sha256
            release/${{ steps.artifacts.outputs.base }}.SHASUMS
            release/${{ steps.artifacts.outputs.base }}.zip.sig
            release/${{ steps.artifacts.outputs.base }}.dmg.sig
            release/${{ steps.artifacts.outputs.base }}.notarization.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  universal:
    name: Merge universal build
    needs: [setup, build]
    if: ${{ needs.setup.outputs.build_universal == 'true' }}
    runs-on: macos-14
    env:
      APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-darwin-arm64

      - name: Download arm64 .app
        uses: actions/download-artifact@v4
        with:
          name: app-darwin-arm64
          path: ${{ runner.temp }}/arm64

      - name: Download x64 .app
        uses: actions/download-artifact@v4
        with:
          name: app-darwin-x64
          path: ${{ runner.temp }}/x64

      - name: Merge into universal .app via @electron/universal
        env:
          ARM_APP: ${{ runner.temp }}/u-arm64/Snip Talk.app
          X64_APP: ${{ runner.temp }}/u-x64/Snip Talk.app
          OUT_APP: ${{ runner.temp }}/u-out/Snip Talk.app
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/u-arm64" "$RUNNER_TEMP/u-x64" "$RUNNER_TEMP/u-out"
          /usr/bin/ditto -x -k "$RUNNER_TEMP/arm64/app-darwin-arm64.zip" "$RUNNER_TEMP/u-arm64"
          /usr/bin/ditto -x -k "$RUNNER_TEMP/x64/app-darwin-x64.zip" "$RUNNER_TEMP/u-x64"
          rm -rf "$OUT_APP"
          node -e "
            const { makeUniversalApp } = require('@electron/universal');
            makeUniversalApp({
              x64AppPath: process.env.X64_APP,
              arm64AppPath: process.env.ARM_APP,
              outAppPath: process.env.OUT_APP,
              force: true,
            }).then(() => console.log('merged universal app'))
              .catch(e => { console.error(e); process.exit(1); });
          "

      - name: Verify universal binary
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/u-out/Snip Talk.app"
          BIN="$APP/Contents/MacOS/$(ls "$APP/Contents/MacOS" | head -n1)"
          ARCHS=$(lipo -archs "$BIN")
          echo "universal binary archs: $ARCHS"
          [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]] || { echo "::error::universal binary missing an arch ($ARCHS)"; exit 1; }

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Sign, notarize, package universal DMG
        env:
          ARCH: universal
          BUILD_NUMBER: ${{ github.run_number }}
          PREBUILT_APP_PATH: ${{ runner.temp }}/u-out/Snip Talk.app
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/release-mac.sh

      - name: Compute universal artifact paths
        id: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          JSON=$(ls release/*-darwin-universal.json | head -n1)
          BASE="$(basename "${JSON%.json}")"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Upload universal artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.base }}
          path: |
            release/${{ steps.artifacts.outputs.base }}.zip
            release/${{ steps.artifacts.outputs.base }}.dmg
            release/${{ steps.artifacts.outputs.base }}.json
            release/${{ steps.artifacts.outputs.base }}.json.sha256
            release/${{ steps.artifacts.outputs.base }}.SHASUMS
            release/${{ steps.artifacts.outputs.base }}.zip.sig
            release/${{ steps.artifacts.outputs.base }}.dmg.sig
            release/${{ steps.artifacts.outputs.base }}.notarization.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  release:
    name: Publish GitHub Release
    needs: [build, universal]
    if: ${{ always() && needs.build.result == 'success' && (needs.universal.result == 'success' || needs.universal.result == 'skipped') && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Generate release notes from build stamps
        id: notes
        run: |
          set -euo pipefail
          NOTES="dist/RELEASE_NOTES.md"
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}"
          {
            echo "# Snip Talk — ${TAG}"
            echo ""
            echo "_Built from commit \`${GITHUB_SHA}\` via run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
            echo ""
            echo "## Build stamps"
            echo ""
            for j in dist/*.json; do
              [[ -e "$j" ]] || continue
              base="$(basename "${j%.json}")"
              stamp="$(jq -r '.versionStamp // .version_stamp // .stamp // .version // empty' "$j" 2>/dev/null || true)"
              commit="$(jq -r '.gitSha // .git_sha // .commit // empty' "$j" 2>/dev/null || true)"
              built="$(jq -r '.builtAt // .built_at // empty'   "$j" 2>/dev/null || true)"
              notar="$(jq -r '.notarization.status // "skipped"' "$j" 2>/dev/null || echo skipped)"
              zip_id="$(jq -r '.notarization.zip_submission_id // empty' "$j" 2>/dev/null || true)"
              dmg_id="$(jq -r '.notarization.dmg_submission_id // empty' "$j" 2>/dev/null || true)"
              echo "### \`$base\`"
              [[ -n "$stamp"  ]] && echo "- **Version stamp:** \`$stamp\`"
              [[ -n "$commit" ]] && echo "- **Commit:** \`$commit\`"
              [[ -n "$built"  ]] && echo "- **Built at:** $built"
              case "$notar" in
                accepted) echo "- **Notarization:** ✅ Accepted (Apple stapled)";;
                failed)   echo "- **Notarization:** ❌ Failed — see \`${base}.notarization.log\`";;
                skipped)  echo "- **Notarization:** ⚠️ Skipped (unsigned build)";;
                *)        echo "- **Notarization:** $notar";;
              esac
              [[ -n "$zip_id" ]] && echo "- ZIP submission id: \`$zip_id\`"
              [[ -n "$dmg_id" ]] && echo "- DMG submission id: \`$dmg_id\`"
              echo ""
            done
            echo "## SHA-256 checksums"
            echo ""
            echo '```'
            cat dist/*.SHASUMS 2>/dev/null || true
            echo '```'
            echo ""
            echo "Verify with: \`shasum -a 256 -c <artifact>.SHASUMS\`"
            echo ""
            echo "Verify Apple notarization on a downloaded artifact:"
            echo '```'
            echo "spctl -a -vv -t install <artifact>.dmg"
            echo "stapler validate <artifact>.dmg"
            echo '```'
          } > "$NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          echo "----- Release notes -----"
          cat "$NOTES"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          append_body: true
          fail_on_unmatched_files: true
          # All files use the stamped basename emitted by version-stamp.sh.
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.json
            dist/*.SHASUMS
            dist/*.json.sha256
            dist/*.sig
            dist/*.notarization.log
