name: Release (macOS)

# Build, sign, notarize, and publish Snip Talk for macOS.
#
# Triggers:
#   • push of a tag like v0.1.0          → full release, uploads to a GitHub Release
#   • manual run via "Run workflow"      → builds artifacts, optional release upload
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_IDENTITY                   e.g. "Developer ID Application: Acme (TEAMID)"
#   APPLE_ID                         Apple ID email used for notarization
#   APPLE_TEAM_ID                    10-char Apple Developer team id
#   APPLE_APP_SPECIFIC_PASSWORD      app-specific password for notarytool
#   APPLE_CERT_P12_BASE64            base64 of your Developer ID .p12 file
#   APPLE_CERT_PASSWORD              password used when exporting the .p12
#
# Without the cert/notary secrets the workflow still produces an UNSIGNED build
# (useful for smoke-testing PRs).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      arch:
        description: "Target arch"
        type: choice
        default: "universal"
        options: ["arm64", "x64", "universal"]
      publish_release:
        description: "Upload artifacts to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write    # needed to create/update a Release

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build • ${{ matrix.arch }}
    runs-on: macos-14   # arm64 runner; cross-compiles x64/universal cleanly
    strategy:
      fail-fast: false
      matrix:
        # On manual runs, build only the chosen arch; on tag pushes build all three.
        arch: ${{ github.event_name == 'workflow_dispatch' && fromJson(format('["{0}"]', inputs.arch)) || fromJson('["arm64","x64","universal"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release-mac.sh uses git rev-list --count for build #

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, package
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/release-mac.sh

      - name: Compute artifact paths
        id: artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          SUFFIX="darwin-${{ matrix.arch }}"
          ZIP=$(ls release/*-${SUFFIX}.zip | head -n1)
          DMG=$(ls release/*-${SUFFIX}.dmg | head -n1)
          JSON=$(ls release/*-${SUFFIX}.json | head -n1)
          BASE="$(basename "${JSON%.json}")"
          echo "zip=$ZIP"   >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG"   >> "$GITHUB_OUTPUT"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "Stamped artifact base: $BASE"

      - name: Verify artifacts (size, checksum, install smoke-test)
        env:
          ZIP: ${{ steps.artifacts.outputs.zip }}
          DMG: ${{ steps.artifacts.outputs.dmg }}
          JSON: ${{ steps.artifacts.outputs.json }}
          BASE: ${{ steps.artifacts.outputs.base }}
          # Reject builds whose installer is suspiciously tiny/huge — guards
          # against empty .app bundles and accidental `node_modules` blowups.
          MIN_BYTES: 20000000     # 20 MB
          MAX_BYTES: 600000000    # 600 MB
        run: |
          set -euo pipefail

          fail() { echo "::error::$*"; exit 1; }
          ok()   { echo "✅ $*"; }

          [[ -f "$ZIP"  ]] || fail "ZIP missing: $ZIP"
          [[ -f "$DMG"  ]] || fail "DMG missing: $DMG"
          [[ -f "$JSON" ]] || fail "manifest missing: $JSON"

          # ---- Size sanity ----
          for f in "$ZIP" "$DMG"; do
            sz=$(stat -f%z "$f")
            human=$(du -h "$f" | awk '{print $1}')
            (( sz >= MIN_BYTES )) || fail "$f is too small ($human, ${sz}B)"
            (( sz <= MAX_BYTES )) || fail "$f is too large ($human, ${sz}B)"
            ok "size OK: $(basename "$f") = $human"
          done

          # ---- Checksum verification against the SHASUMS sidecar ----
          SHASUMS="release/${BASE}.SHASUMS"
          [[ -f "$SHASUMS" ]] || fail "missing $SHASUMS"
          ( cd release && shasum -a 256 -c "$(basename "$SHASUMS")" ) \
            || fail "checksum verification failed"
          ok "sha256 verified for all artifacts"

          # Cross-check that the manifest's recorded sha matches what we computed.
          for key in zip dmg; do
            file=$(jq -r ".artifacts.${key}.file"   "$JSON")
            want=$(jq -r ".artifacts.${key}.sha256" "$JSON")
            got=$(shasum -a 256 "release/${file}" | awk '{print $1}')
            [[ "$want" == "$got" ]] || fail "manifest sha mismatch for ${key}: want=$want got=$got"
            ok "manifest sha matches for ${file}"
          done

          # ---- Install smoke-test: mount DMG, copy .app, launch, kill ----
          MOUNT="$RUNNER_TEMP/dmg-mount"
          rm -rf "$MOUNT" && mkdir -p "$MOUNT"
          hdiutil attach "$DMG" -mountpoint "$MOUNT" -nobrowse -quiet \
            || fail "hdiutil attach failed"
          trap 'hdiutil detach "$MOUNT" -quiet || true' EXIT

          APP=$(ls -d "$MOUNT"/*.app | head -n1)
          [[ -d "$APP" ]] || fail "no .app inside DMG"
          ok "DMG mounted, found $(basename "$APP")"

          # Verify codesign (allow unsigned only when no APPLE_IDENTITY was set).
          if [[ -n "${APPLE_IDENTITY:-}" ]]; then
            codesign --verify --deep --strict --verbose=2 "$APP" \
              || fail "codesign verification failed"
            ok "codesign verified"
            spctl --assess --type execute --verbose=2 "$APP" \
              || echo "::warning::spctl assessment failed (notarization may be pending)"
            xcrun stapler validate "$APP" \
              && ok "staple ticket valid" \
              || echo "::warning::no valid staple ticket on .app"
          else
            echo "::warning::APPLE_IDENTITY not set — skipping codesign/spctl checks"
          fi

          # Copy out, launch headlessly, confirm process starts, then kill.
          STAGE="$RUNNER_TEMP/installed"
          mkdir -p "$STAGE"
          cp -R "$APP" "$STAGE/"
          INSTALLED="$STAGE/$(basename "$APP")"
          ok "copied to $INSTALLED"

          # Don't actually let the GUI open windows on the runner; -j returns
          # immediately after launching, then we kill by bundle id.
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INSTALLED/Contents/Info.plist")
          echo "Launching $BUNDLE_ID for smoke test…"
          open -j -g -a "$INSTALLED" || fail "open failed"
          sleep 4
          if pgrep -f "$INSTALLED/Contents/MacOS/" >/dev/null; then
            ok "process is running"
            pkill -f "$INSTALLED/Contents/MacOS/" || true
          else
            fail "app did not start (no process matched $INSTALLED)"
          fi

          # Confirm the launched binary's version metadata matches the manifest.
          PLIST_VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INSTALLED/Contents/Info.plist")
          MAN_VER=$(jq -r '.version' "$JSON")
          [[ "$PLIST_VER" == "$MAN_VER" ]] || fail "version mismatch: plist=$PLIST_VER manifest=$MAN_VER"
          ok "version stamp matches: $PLIST_VER"

          echo
          echo "🎉 all artifact verifications passed for $BASE"

      - name: Upload workflow artifacts (stamped filenames)
        uses: actions/upload-artifact@v4
        with:
          # Artifact name itself carries the version stamp so downloads land
          # with the same stamped basename used for the release upload.
          name: ${{ steps.artifacts.outputs.base }}
          path: |
            release/${{ steps.artifacts.outputs.base }}.zip
            release/${{ steps.artifacts.outputs.base }}.dmg
            release/${{ steps.artifacts.outputs.base }}.json
            release/${{ steps.artifacts.outputs.base }}.json.sha256
            release/${{ steps.artifacts.outputs.base }}.SHASUMS
            release/${{ steps.artifacts.outputs.base }}.zip.sig
            release/${{ steps.artifacts.outputs.base }}.dmg.sig
            release/${{ steps.artifacts.outputs.base }}.notarization.log
          if-no-files-found: warn
          retention-days: 14

      - name: Cleanup signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Generate release notes from build stamps
        id: notes
        run: |
          set -euo pipefail
          NOTES="dist/RELEASE_NOTES.md"
          TAG="${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}"
          {
            echo "# Snip Talk — ${TAG}"
            echo ""
            echo "_Built from commit \`${GITHUB_SHA}\` via run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
            echo ""
            echo "## Build stamps"
            echo ""
            for j in dist/*.json; do
              [[ -e "$j" ]] || continue
              base="$(basename "${j%.json}")"
              stamp="$(jq -r '.versionStamp // .version_stamp // .stamp // .version // empty' "$j" 2>/dev/null || true)"
              commit="$(jq -r '.gitSha // .git_sha // .commit // empty' "$j" 2>/dev/null || true)"
              built="$(jq -r '.builtAt // .built_at // empty'   "$j" 2>/dev/null || true)"
              notar="$(jq -r '.notarization.status // "skipped"' "$j" 2>/dev/null || echo skipped)"
              zip_id="$(jq -r '.notarization.zip_submission_id // empty' "$j" 2>/dev/null || true)"
              dmg_id="$(jq -r '.notarization.dmg_submission_id // empty' "$j" 2>/dev/null || true)"
              echo "### \`$base\`"
              [[ -n "$stamp"  ]] && echo "- **Version stamp:** \`$stamp\`"
              [[ -n "$commit" ]] && echo "- **Commit:** \`$commit\`"
              [[ -n "$built"  ]] && echo "- **Built at:** $built"
              case "$notar" in
                accepted) echo "- **Notarization:** ✅ Accepted (Apple stapled)";;
                failed)   echo "- **Notarization:** ❌ Failed — see \`${base}.notarization.log\`";;
                skipped)  echo "- **Notarization:** ⚠️ Skipped (unsigned build)";;
                *)        echo "- **Notarization:** $notar";;
              esac
              [[ -n "$zip_id" ]] && echo "- ZIP submission id: \`$zip_id\`"
              [[ -n "$dmg_id" ]] && echo "- DMG submission id: \`$dmg_id\`"
              echo ""
            done
            echo "## SHA-256 checksums"
            echo ""
            echo '```'
            cat dist/*.SHASUMS 2>/dev/null || true
            echo '```'
            echo ""
            echo "Verify with: \`shasum -a 256 -c <artifact>.SHASUMS\`"
            echo ""
            echo "Verify Apple notarization on a downloaded artifact:"
            echo '```'
            echo "spctl -a -vv -t install <artifact>.dmg"
            echo "stapler validate <artifact>.dmg"
            echo '```'
          } > "$NOTES"
          echo "path=$NOTES" >> "$GITHUB_OUTPUT"
          echo "----- Release notes -----"
          cat "$NOTES"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          body_path: ${{ steps.notes.outputs.path }}
          append_body: true
          fail_on_unmatched_files: true
          # All files use the stamped basename emitted by version-stamp.sh.
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.json
            dist/*.SHASUMS
            dist/*.json.sha256
            dist/*.sig
            dist/*.notarization.log
