name: Release (macOS)

# Build, sign, notarize, and publish Snip Talk for macOS.
#
# Triggers:
#   • push of a tag like v0.1.0          → full release, uploads to a GitHub Release
#   • manual run via "Run workflow"      → builds artifacts, optional release upload
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_IDENTITY                   e.g. "Developer ID Application: Acme (TEAMID)"
#   APPLE_ID                         Apple ID email used for notarization
#   APPLE_TEAM_ID                    10-char Apple Developer team id
#   APPLE_APP_SPECIFIC_PASSWORD      app-specific password for notarytool
#   APPLE_CERT_P12_BASE64            base64 of your Developer ID .p12 file
#   APPLE_CERT_PASSWORD              password used when exporting the .p12
#
# Without the cert/notary secrets the workflow still produces an UNSIGNED build
# (useful for smoke-testing PRs).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      arch:
        description: "Target arch"
        type: choice
        default: "universal"
        options: ["arm64", "x64", "universal"]
      publish_release:
        description: "Upload artifacts to a GitHub Release"
        type: boolean
        default: false

permissions:
  contents: write    # needed to create/update a Release

concurrency:
  group: release-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build • ${{ matrix.arch }}
    runs-on: macos-14   # arm64 runner; cross-compiles x64/universal cleanly
    strategy:
      fail-fast: false
      matrix:
        arch: >-
          ${{ github.event_name == 'workflow_dispatch'
              && fromJson(format('["{0}"]', inputs.arch))
              || fromJson('["arm64","x64","universal"]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # release-mac.sh uses git rev-list --count for build #

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID certificate
        if: ${{ env.APPLE_CERT_P12_BASE64 != '' }}
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/cert.p12"
          echo "$APPLE_CERT_P12_BASE64" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$APPLE_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" >/dev/null
          rm -f "$CERT_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, package
        env:
          ARCH: ${{ matrix.arch }}
          BUILD_NUMBER: ${{ github.run_number }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: bash scripts/release-mac.sh

      - name: Compute artifact paths
        id: artifacts
        run: |
          set -euo pipefail
          ZIP=$(ls release/*-darwin-${{ matrix.arch }}.zip | head -n1)
          DMG=$(ls release/*-darwin-${{ matrix.arch }}.dmg | head -n1)
          JSON=$(ls release/*-darwin-${{ matrix.arch }}.json | head -n1)
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "json=$JSON" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: snip-talk-darwin-${{ matrix.arch }}
          path: |
            ${{ steps.artifacts.outputs.zip }}
            ${{ steps.artifacts.outputs.dmg }}
            ${{ steps.artifacts.outputs.json }}
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing keychain
        if: always() && env.KEYCHAIN_PATH != ''
        run: security delete-keychain "$KEYCHAIN_PATH" || true

  release:
    name: Publish GitHub Release
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release) }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build {0}', github.run_number) }}
          draft: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.json
