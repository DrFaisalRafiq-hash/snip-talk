<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Snip Talk</title>
    <style>
      :root {
        --bg: #f5f3ee;
        --fg: #1a1a1a;
        --muted: #6b6b6b;
        --border: #e3dfd5;
        --signal: #e63946;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 280px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 16px;
      }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .dots { display: inline-flex; gap: 4px; align-items: center; }
      .dots span {
        width: 8px; height: 8px; border-radius: 999px;
        background: var(--signal);
        animation: blink 1.2s steps(2, end) infinite;
      }
      .dots span:nth-child(2) { animation-delay: .18s; }
      .dots span:nth-child(3) { animation-delay: .36s; }
      @keyframes blink { 50% { opacity: .15; } }
      .title { font-weight: 600; font-size: 15px; letter-spacing: -0.01em; }
      .sub { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .12em; margin-bottom: 12px; }
      .row {
        display: block; width: 100%; text-align: left; background: #fff;
        border: 1px solid var(--border); border-radius: 10px;
        padding: 10px 12px; margin-bottom: 8px; font-size: 13px; color: var(--fg);
        cursor: pointer; transition: transform .08s ease, background .12s ease;
      }
      .row:hover { background: #fffaf2; transform: translateY(-1px); }
      .row .k { font-size: 10px; color: var(--muted); float: right; font-family: ui-monospace, SFMono-Regular, monospace; }
      .footer {
        margin-top: 10px; font-size: 10px; color: var(--muted);
        text-align: center; display: flex; justify-content: space-between; align-items: center;
      }
      .footer button {
        background: none; border: none; color: var(--muted); font-size: 10px;
        cursor: pointer; padding: 0; text-decoration: underline; font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <span class="dots"><span></span><span></span><span></span></span>
      <span class="title">Snip Talk</span>
    </div>
    <div class="sub">Quick launcher</div>

    <button id="dictate-here" class="row" style="background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:600;">
      🎙 Dictate here (no app needed)
    </button>

    <div id="rows"></div>

    <div class="footer">
      <span id="base-display"></span>
      <button id="open-options">Options</button>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
